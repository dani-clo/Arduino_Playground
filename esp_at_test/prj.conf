CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_WATCHDOG=y
CONFIG_PRINTK=y

# The esp8266 node is only used to find the UART and the reset line; the
# ESP-AT WiFi driver must stay off so it does not claim the UART.
CONFIG_WIFI=n
CONFIG_NETWORKING=n

# Reset vector at 0x08000000 is BFM, where MCUboot lives
CONFIG_ROMSTART_RELOCATION_ROM=n
CONFIG_BOOTLOADER_MCUBOOT=y

# Console on USB CDC ACM (see app.overlay); same stack sizing as the core.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UDC_BUF_POOL_SIZE=8192
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_SAMPLE_USBD_VID=0x2341
CONFIG_SAMPLE_USBD_PID=0x008e
CONFIG_SAMPLE_USBD_MANUFACTURER="Arduino"
CONFIG_SAMPLE_USBD_PRODUCT="Monica ESP-AT test"

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_REBOOT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
